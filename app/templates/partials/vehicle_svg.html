{% macro vehicle_shape(typ) %}
{% if typ == 'pkw' %}
<svg viewBox="0 0 220 420" class="vehicle-shape" xmlns="http://www.w3.org/2000/svg">
  <rect x="40" y="50" width="140" height="320" rx="34" fill="#dce7f5" stroke="#5b7ca8" stroke-width="4"/>
  <rect x="55" y="90" width="110" height="55" rx="14" fill="#8fb0da"/>
  <rect x="20" y="90" width="16" height="55" rx="6" fill="#3a4655"/>
  <rect x="184" y="90" width="16" height="55" rx="6" fill="#3a4655"/>
  <rect x="20" y="280" width="16" height="55" rx="6" fill="#3a4655"/>
  <rect x="184" y="280" width="16" height="55" rx="6" fill="#3a4655"/>
</svg>
{% elif typ == 'sprinter' %}
<svg viewBox="0 0 220 420" class="vehicle-shape" xmlns="http://www.w3.org/2000/svg">
  <rect x="28" y="20" width="164" height="380" rx="20" fill="#dce7f5" stroke="#5b7ca8" stroke-width="4"/>
  <rect x="45" y="45" width="130" height="60" rx="10" fill="#8fb0da"/>
  <rect x="10" y="70" width="16" height="55" rx="6" fill="#3a4655"/>
  <rect x="194" y="70" width="16" height="55" rx="6" fill="#3a4655"/>
  <rect x="10" y="310" width="16" height="55" rx="6" fill="#3a4655"/>
  <rect x="194" y="310" width="16" height="55" rx="6" fill="#3a4655"/>
</svg>
{% elif typ == 'lkw' %}
<svg viewBox="0 0 220 420" class="vehicle-shape" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="20" width="160" height="140" rx="22" fill="#dce7f5" stroke="#5b7ca8" stroke-width="4"/>
  <rect x="48" y="40" width="124" height="55" rx="10" fill="#8fb0da"/>
  <rect x="55" y="160" width="110" height="230" rx="10" fill="#dce7f5" stroke="#5b7ca8" stroke-width="4"/>
  <rect x="6" y="70" width="18" height="60" rx="6" fill="#3a4655"/>
  <rect x="196" y="70" width="18" height="60" rx="6" fill="#3a4655"/>
  <rect x="18" y="330" width="24" height="55" rx="6" fill="#3a4655"/>
  <rect x="178" y="330" width="24" height="55" rx="6" fill="#3a4655"/>
</svg>
{% else %}
<svg viewBox="0 0 220 420" class="vehicle-shape" xmlns="http://www.w3.org/2000/svg">
  <rect x="35" y="15" width="150" height="390" rx="8" fill="#dce7f5" stroke="#5b7ca8" stroke-width="4"/>
  <line x1="35" y1="45" x2="185" y2="45" stroke="#5b7ca8" stroke-width="2"/>
  <rect x="10" y="300" width="22" height="50" rx="6" fill="#3a4655"/>
  <rect x="188" y="300" width="22" height="50" rx="6" fill="#3a4655"/>
  <rect x="10" y="355" width="22" height="50" rx="6" fill="#3a4655"/>
  <rect x="188" y="355" width="22" height="50" rx="6" fill="#3a4655"/>
</svg>
{% endif %}
{% endmacro %}
