<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tr(titel_key) }} · DispoHub</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">Dispo<span>Hub</span></div>
      <div class="card" style="text-align:center">
        <div style="font-size:40px;margin-bottom:6px">{{ icon }}</div>
        <h2 style="margin:0 0 8px">{{ tr(titel_key) }}</h2>
        <p class="muted" style="margin:0 0 18px">{{ custom_text or tr(text_key) }}</p>
        {% if angemeldet_als %}
        <p class="muted" style="font-size:13px;margin-bottom:18px">
          {{ tr('error.logged_in_as', name=angemeldet_als, rolle=tr('role.' + user_role))|safe }}
        </p>
        {% endif %}
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <a href="/" class="btn ghost sm">{{ tr('error.back_dashboard') }}</a>
          <a href="/logout" class="btn ghost sm">{{ tr('error.logout_relogin') }}</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
