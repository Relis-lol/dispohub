<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vordruck{% endblock %} · DispoHub</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
  <style>
    body { background: #fff; color: #000; }
    .sheet { max-width: 820px; margin: 0 auto; padding: 28px 34px; font-size: 13px; }
    .sheet-head { display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #000;
                  padding-bottom: 10px; margin-bottom: 16px; }
    .sheet-head img { max-height: 44px; max-width: 180px; object-fit: contain; }
    .sheet-head h1 { font-size: 19px; margin: 0; }
    .sheet-head .sub { color: #444; font-size: 12px; }
    .sheet table { width: 100%; border-collapse: collapse; }
    .sheet th, .sheet td { border: 1px solid #000; padding: 5px 7px; font-size: 12px; text-align: left; }
    .sheet th { background: #eee; text-transform: none; letter-spacing: 0; color: #000; }
    .sheet td.blank { min-width: 70px; height: 22px; }
    .feld { display: inline-block; border-bottom: 1px solid #000; min-width: 220px; padding: 0 4px 1px; }
    .feldzeile { margin: 10px 0; }
    .unterschriften { display: flex; gap: 40px; margin-top: 46px; }
    .unterschriften div { flex: 1; border-top: 1px solid #000; padding-top: 4px; font-size: 11px; color: #333; }
    .toolbar { max-width: 820px; margin: 14px auto 0; padding: 0 34px; display: flex; gap: 8px; }
    @media print { .toolbar { display: none; } .sheet { padding: 0; } }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <a href="/vordrucke" class="btn ghost sm">{{ tr('forms.back_forms') }}</a>
    <button type="button" class="btn sm" onclick="window.print()">{{ tr('forms.print_or_pdf') }}</button>
  </div>
  <div class="sheet">
    <div class="sheet-head">
      {% if logo %}<img src="{{ logo }}" alt="Logo">{% endif %}
      <div>
        <h1>{% block kopf %}{% endblock %}</h1>
        <div class="sub">{% block untertitel %}{% endblock %}</div>
      </div>
    </div>
    {% block inhalt %}{% endblock %}
  </div>
</body>
</html>
