<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tr('login.title') }} · DispoHub</title>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand">Dispo<span>Hub</span></div>
      {% include "partials/lang_switcher.html" %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <label for="email">{{ tr('login.email') }}</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        <label for="password">{{ tr('login.password') }}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div style="height:14px"></div>
        <button class="btn block" type="submit">{{ tr('login.submit') }}</button>
      </form>
      <div class="demo-accounts">
        <strong>{{ tr('login.demo_title') }}</strong><br>
        GF <code>gf@dispohub.example</code> / <code>gf123</code><br>
        Büro <code>buero@dispohub.example</code> / <code>buero123</code><br>
        IT <code>it@dispohub.example</code> / <code>it123</code><br>
        Fahrer <code>fahrer1@dispohub.example</code> / <code>fahrer123</code>
      </div>
    </div>
  </div>
</body>
</html>
