name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Local (SQLite, no Docker)
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DispoHub version / commit
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Please redact anything sensitive (real names, emails, internal URLs).
    validations:
      required: false
