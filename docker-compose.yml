services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispohub
      POSTGRES_PASSWORD: dispohub
      POSTGRES_DB: dispohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispohub"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: dev-secret-change-me-please-0123456789
      DATABASE_URL: postgresql+psycopg2://dispohub:dispohub@db:5432/dispohub
      SEED_ON_STARTUP: "true"
    volumes:
      - ./app/static/uploads:/code/app/static/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Kleine Web-Oberfläche für die DB (optional, http://localhost:8080)
  adminer:
    image: adminer:4
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  pgdata:
